; GTA: Vive gameplay options. Re-read about once a second, so edits apply while the game runs.
; Every line is optional (a line left out uses its default); these are the defaults.
; All of it can also be changed in game in the settings menu (OpenMenu key, default Ctrl+F5),
; which saves here at once.

[Beta]
; 1 = pushing the stick forward walks where the headset looks
MoveWhereYouLook=0
; 1 = the on-foot camera is attached to the character (no walking jitter)
AnchorCameraToPlayer=0
; With AnchorCameraToPlayer: 0 = rigid, >0 = soft follow time constant in ms (0-2000)
FollowSmoothMs=0
; 1 = right stick left/right turns the play space; speed in degrees per second (10-360)
StickTurn=0
StickTurnSpeed=90
; How much the view tilts with a vehicle, 0 (horizon locked) to 100
VehicleAttitudeFollow=0
VehicleAttitudeDeadzone=0
VehicleAttitudeSmoothMs=150
; How far the view goes down with a falling or ragdolled character, 0-100
PedFallFollow=0
; Moves your viewpoint down (-) or up (+) in cm, -100 to 50 (tall players: try -15 to -30)
HeightOffsetCm=0
; 1 = where you stand when VR starts counts as inside the character (RecentreView does it any time)
CentreOnVrStart=1
; 1 = enter VR without the EnterVR key once the headset is ready
AutoStartVR=0

[Keys]
; Optional modifiers + key joined with '+', e.g. Ctrl+L, Ctrl+Shift+F8, Alt+Home, K.
; Modifiers: Ctrl, Shift, Alt. Keys: A-Z, 0-9, F1-F24, Home, End, Insert, Delete, PageUp, PageDown,
; Up, Down, Left, Right, Space, Tab, Enter, Esc, Backspace, Pause, Numpad0-Numpad9, NumpadAdd,
; NumpadSub, NumpadMul, NumpadDiv, NumpadDot, Comma, Period, Slash, Semicolon, Quote, LBracket,
; RBracket, Backslash, Minus, Equals, Grave - or a virtual-key code (decimal, or hex like 0x77).
; Matching is exact: a bind without modifiers does not fire while Ctrl/Shift/Alt are held.
; Set a key to None (or leave it empty) to unbind it; the menu key always stays bound.
; (A menu navigation key set to None still navigates with its default key.)
; The stabilizer and room scale keys are in stabilizer.ini [Hotkeys].
; Enter VR; while in VR the same key re-creates the hand pistol
EnterVR=Ctrl+L
; VR off, and back on
VROff=Ctrl+Shift+L
; Put the VR view back inside the character
RecentreView=Ctrl+Shift+C
; Touchpad fly-move on / off
FlyMove=1
; Left-controller vehicle steering on / off
LeftHandSteering=2
; Write the melee prop rotation values to gravovrvalues.txt
MeleeCalibrationDump=U
; Open / close the settings menu (works with VR on or off). While VRCam runs with the same menu key,
; this key opens VRCam's menu, and its first row "GTAVR Settings" opens this one.
OpenMenu=Ctrl+F5
; Menu navigation (Esc always goes back as well)
MenuUp=Up
MenuDown=Down
MenuLeft=Left
MenuRight=Right
MenuSelect=Enter
MenuBack=Backspace
