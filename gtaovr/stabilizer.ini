; GTA: Vive camera stabilizer and head tracking settings.
; This file is re-read automatically when it changes, so edits apply while the game runs.
; Toggle the stabilizer in game with ToggleKey (default Ctrl+Shift+F8),
; reload this file with ReloadKey (default Ctrl+Shift+F9).
; The GTA: Vive settings menu (OpenMenu key in gtavive.ini, default Ctrl+F6) edits this file too.

[Stabilization]
Enabled=1
; Preset:
;   Jitter   = fixed smoothing on all axes (adds a constant lag).
;   Manual   = per-axis control, see [Manual].
;   Adaptive = smooth when still, responsive on fast moves (recommended).
Preset=Adaptive
; Smooth the physical movement and/or the looking-around (1/0).
StabilizePosition=1
StabilizeRotation=1

[Jitter]
; Milliseconds, 0-600; higher = smoother but laggier
PosSmoothMs=180
RotSmoothMs=30

[Manual]
; Per-axis smoothing strength, 0 (raw) to 100 (MaxSmoothMs worth).
; Axes follow where the camera faces.
PitchStrength=35
YawStrength=20
RollStrength=35
VerticalStrength=45
LateralStrength=15
DepthStrength=45
MaxSmoothMs=400

[Adaptive]
; Cutoff in Hz (lower = smoother when still); beta adds speed response
PosMinCutoff=1.00
PosBeta=10.00
RotMinCutoff=1.00
RotBeta=3.00

[Overlay]
; On-screen feedback when you change a setting (not drawn on GTA V Enhanced). 0 = off;
; the window title and beeps still show the values.
Enabled=0
DurationSec=2.5

[Hotkeys]
; Optional modifiers + key joined with '+', e.g. Ctrl+Shift+F8, Alt+Home, K.
; Matching is exact: a bind without modifiers does not fire while Ctrl/Shift/Alt are held.
; Key names are the same as in gtavive.ini [Keys]. Changes apply on the automatic reload.
; Set a key to None (or leave it empty) to unbind it; the menu key always stays bound.
ToggleKey=Ctrl+Shift+F8
ReloadKey=Ctrl+Shift+F9
; PresetKey cycles Jitter -> Manual -> Adaptive. TargetKey picks what Up/Down adjust.
; Up = more smoothing, Down = less (hold to repeat). SaveKey writes live values here.
PresetKey=Ctrl+Shift+P
TargetKey=Ctrl+Shift+A
UpKey=Ctrl+Shift+Up
DownKey=Ctrl+Shift+Down
SaveKey=Ctrl+Shift+S
; Room scale: makes the current spot the centre again
ReanchorKey=Ctrl+Shift+Home

[RoomScale]
; Amplifies real walking in a small room (ReanchorKey re-anchors). Off by default.
Enabled=0
PlaneGain=4.0
VerticalGain=1.0
MaxRadius=40.0
Mode=1
WalkSpeedMin=0.15
WalkSpeedFull=0.50
InnerRadius=0.50

[Timing]
; 0 = wait for the newest pose, 1 = interpolate to the game frame's time (smoothest), 2 = extrapolate
PoseTiming=1
InterpDelayMs=0
MaxPredictMs=20
TraceFrames=0
